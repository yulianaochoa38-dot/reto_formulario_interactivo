<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - QuantumLeap</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="menu">
        <form class="caja">
             <h1>Acceso a QuantumLeap</h1>
            <p>
                <label for="username">Nombre de Usuario:</label><br>
                <input type="text" id="username" name="username" placeholder="Ingrese el usuario" class="ingresar" required>
            </p>
            <p>
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" placeholder="Ingrese contraseña" class="ingresar" required>
            </p>
            <button type="submit" class="sign">Iniciar Sesión</button>
        </form>
    </main>
</body>
</html>
